services:
  postgres:
    image: postgres:16-alpine
    container_name: syncdraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncdraft}
      POSTGRES_USER: ${POSTGRES_USER:-syncdraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncdraft} -d ${POSTGRES_DB:-syncdraft}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncdraft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: syncdraft-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syncdraft}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-syncdraft}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: 60
      COLLABORATION_URL: ws://localhost:1234
      COLLABORATION_TICKET_SECONDS: 90
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  collaboration:
    build: ./collaboration
    container_name: syncdraft-collaboration
    restart: unless-stopped
    environment:
      PORT: 1234
      COLLAB_SECRET: ${JWT_SECRET:-development-only-change-this-secret}
      DATABASE_URL: postgres://${POSTGRES_USER:-syncdraft}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-syncdraft}
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "1234:1234"
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: syncdraft-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_COLLAB_URL: ws://localhost:1234
    ports:
      - "5173:5173"
    depends_on:
      - api
      - collaboration

volumes:
  postgres_data:
